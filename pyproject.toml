[project]
name = "alexandria-vector-shelf-mcp"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv.workspace]
# ingestion, chat, and mcp are added here once each has its own
# pyproject.toml (ADR-008) — an empty directory breaks `uv sync`.
members = ["shared"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require live Firebase connection (deselect with '-m not integration')",
    "unit: marks fast unit tests with no external dependencies",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "ingestion", "chat", "mcp"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
